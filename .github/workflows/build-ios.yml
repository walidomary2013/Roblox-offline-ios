name: Build Native Novetus iOS App (.ipa)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios-native:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Native Swift/Obj-C Novetus iOS App
        run: |
          xcodebuild -project Novetus_iOS/Novetus_iOS.xcodeproj \
                     -scheme Novetus_iOS \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO

      - name: Package Native Novetus iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Novetus_iOS.app Payload/
          zip -r Novetus_iOS_Native.ipa Payload

      - name: Upload Native Novetus IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Novetus_iOS_Native_IPA
          path: Novetus_iOS_Native.ipa
