<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Solid background covering entire canvas (100% opaque) -->
  <rect width="1024" height="1024" fill="#1A1F2C"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
  </defs>
  <!-- Decorative Ring -->
  <circle cx="512" cy="512" r="360" fill="none" stroke="url(#grad)" stroke-width="24"/>
  
  <!-- Roblox 2017 Tilted Square Block -->
  <g transform="translate(512, 512) rotate(-15)">
    <rect x="-200" y="-200" width="400" height="400" rx="60" fill="url(#blockGrad)" />
    <!-- Inner square hole -->
    <rect x="-70" y="-70" width="140" height="140" rx="20" fill="#1A1F2C" />
  </g>
</svg>
